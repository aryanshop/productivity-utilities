<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraSlate: Semantic Markdown Kanban & Focus Sprint Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Navigation Header -->
        <header class="app-header">
            <div class="brand">
                <svg class="brand-icon" viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="3" x2="9" y2="21"></line>
                    <line x1="15" y1="3" x2="15" y2="21"></line>
                </svg>
                <h1>Aura<span>Slate</span></h1>
            </div>
            <div class="header-controls">
                <div class="timer-widget" id="timerWidget">
                    <span class="timer-label" id="timerLabel">Focus: 25:00</span>
                    <button id="timerToggleBtn" class="btn-icon" title="Start/Pause Sprint">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    </button>
                    <button id="timerResetBtn" class="btn-icon" title="Reset Timer">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    </button>
                </div>
                <button id="newCardBtn" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    New Task
                </button>
                <div class="dropdown">
                    <button id="menuBtn" class="btn btn-secondary">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
                        Data
                    </button>
                    <div class="dropdown-content" id="dropdownMenu">
                        <button id="exportBtn">Export JSON Backup</button>
                        <label for="importFile" class="file-upload-label">Import JSON Backup</label>
                        <input type="file" id="importFile" accept=".json" style="display: none;">
                        <button id="clearAllBtn" class="text-danger">Reset Workspace</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Filter & Search Toolbar -->
        <section class="toolbar">
            <div class="search-box">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Search tasks by title or content...">
            </div>
            <div class="filter-group">
                <select id="priorityFilter">
                    <option value="">All Priorities</option>
                    <option value="high">High Priority</option>
                    <option value="medium">Medium Priority</option>
                    <option value="low">Low Priority</option>
                </select>
                <select id="tagFilter">
                    <option value="">All Tags</option>
                </select>
            </div>
        </section>

        <!-- Kanban Board Grid -->
        <main class="kanban-board" id="kanbanBoard">
            <!-- Columns will be injected by script.js -->
        </main>
    </div>

    <!-- Task Modal (Create / Edit) -->
    <div class="modal" id="taskModal" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Create New Task</h2>
                <button class="btn-close" id="closeModalBtn">&times;</button>
            </div>
            <form id="taskForm">
                <input type="hidden" id="taskId">
                <div class="form-group">
                    <label for="taskTitleInput">Task Title</label>
                    <input type="text" id="taskTitleInput" required placeholder="e.g., Redesign landing page header">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskColumnSelect">Column</label>
                        <select id="taskColumnSelect">
                            <option value="backlog">Backlog</option>
                            <option value="todo">To Do</option>
                            <option value="inprogress">In Progress</option>
                            <option value="review">Review</option>
                            <option value="done">Done</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskPrioritySelect">Priority</label>
                        <select id="taskPrioritySelect">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="taskTagInput">Tags (comma separated)</label>
                    <input type="text" id="taskTagInput" placeholder="frontend, design, urgent">
                </div>
                <div class="form-group markdown-editor-group">
                    <div class="editor-tabs">
                        <button type="button" class="tab-btn active" data-tab="write">Write (Markdown)</button>
                        <button type="button" class="tab-btn" data-tab="preview">Preview</button>
                    </div>
                    <textarea id="taskContentInput" rows="8" placeholder="Write notes using Markdown... **bold**, *italic*, - list, # heading"></textarea>
                    <div id="taskContentPreview" class="markdown-preview" style="display: none;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveTaskBtn">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toastNotification"></div>

    <script src="script.js"></script>
</body>
</html>
