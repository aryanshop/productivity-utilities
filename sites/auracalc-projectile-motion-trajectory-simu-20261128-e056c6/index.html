<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraCalc: Projectile Motion & Trajectory Simulation Laboratory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-content">
            <h1>Aura<span>Calc</span></h1>
            <p class="subtitle">Projectile Motion & Trajectory Simulation Laboratory</p>
        </div>
        <div class="header-actions">
            <button id="btn-presets" class="btn secondary">Presets</button>
            <button id="btn-export" class="btn secondary">Export CSV</button>
        </div>
    </header>

    <main class="app-main">
        <section class="control-panel">
            <div class="panel-section">
                <h2>Launch Parameters</h2>
                <div class="input-group">
                    <label for="velocity">Initial Velocity ($v_0$) <span id="val-velocity">25</span> m/s</label>
                    <input type="range" id="velocity" min="1" max="100" step="0.5" value="25">
                </div>
                <div class="input-group">
                    <label for="angle">Launch Angle ($	heta$) <span id="val-angle">45</span>&deg;</label>
                    <input type="range" id="angle" min="0" max="90" step="1" value="45">
                </div>
                <div class="input-group">
                    <label for="height">Initial Height ($y_0$) <span id="val-height">0.0</span> m</label>
                    <input type="range" id="height" min="0" max="50" step="0.5" value="0">
                </div>
            </div>

            <div class="panel-section">
                <h2>Environment & Physics</h2>
                <div class="input-group">
                    <label for="celestial">Celestial Body</label>
                    <select id="celestial">
                        <option value="9.81">Earth ($9.81\text{ m/s}^2$)</option>
                        <option value="1.62">Moon ($1.62\text{ m/s}^2$)</option>
                        <option value="3.71">Mars ($3.71\text{ m/s}^2$)</option>
                        <option value="24.79">Jupiter ($24.79\text{ m/s}^2$)</option>
                        <option value="custom">Custom Gravity</option>
                    </select>
                </div>
                <div class="input-group" id="custom-gravity-group" style="display: none;">
                    <label for="gravity">Gravity ($g$) <span id="val-gravity">9.81</span> $\text{m/s}^2$</label>
                    <input type="range" id="gravity" min="0.1" max="30" step="0.1" value="9.81">
                </div>
                <div class="input-group">
                    <label for="drag">Air Resistance (Drag Coeff $C_d$) <span id="val-drag">0.0</span></label>
                    <input type="range" id="drag" min="0" max="1" step="0.05" value="0">
                </div>
                <div class="row-inputs">
                    <div class="input-group">
                        <label for="mass">Mass (kg)</label>
                        <input type="number" id="mass" min="0.01" max="1000" step="0.1" value="1.0">
                    </div>
                    <div class="input-group">
                        <label for="area">Area ($m^2$)</label>
                        <input type="number" id="area" min="0.001" max="10" step="0.001" value="0.05">
                    </div>
                </div>
            </div>

            <div class="action-buttons">
                <button id="btn-fire" class="btn primary">Launch Projectile</button>
                <button id="btn-clear" class="btn danger">Clear Canvas</button>
            </div>
        </section>

        <section class="visualization-panel">
            <div class="canvas-container">
                <canvas id="sim-canvas"></canvas>
                <div class="canvas-overlay">
                    <button id="btn-zoom-in" title="Zoom In">+</button>
                    <button id="btn-zoom-out" title="Zoom Out">−</button>
                    <button id="btn-reset-view" title="Reset View">⌖</button>
                </div>
            </div>

            <div class="metrics-grid">
                <div class="metric-card">
                    <span class="metric-label">Max Height</span>
                    <span class="metric-value" id="metric-height">0.00</span>
                    <span class="metric-unit">meters</span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">Flight Time</span>
                    <span class="metric-value" id="metric-time">0.00</span>
                    <span class="metric-unit">seconds</span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">Total Range</span>
                    <span class="metric-value" id="metric-range">0.00</span>
                    <span class="metric-unit">meters</span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">Impact Velocity</span>
                    <span class="metric-value" id="metric-impact">0.00</span>
                    <span class="metric-unit">m/s</span>
                </div>
            </div>
        </section>
    </main>

    <!-- Presets Modal -->
    <div id="modal-presets" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Saved Simulation Presets</h2>
                <button id="modal-close" class="btn-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="preset-save-row">
                    <input type="text" id="preset-name" placeholder="Enter preset name...">
                    <button id="btn-save-preset" class="btn primary">Save Current</button>
                </div>
                <div id="preset-list" class="preset-list">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
